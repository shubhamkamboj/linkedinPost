name: Daily Java LinkedIn Post

on:
  # Every day at 06:00 AM Asia/Kolkata (IST)
  schedule:
    - cron: "5 6 * * *"
      timezone: "Asia/Kolkata"

  # Manual testing
  workflow_dispatch:
    inputs:
      force_run:
        description: "Generate and publish once even when AUTO_POST_ENABLED is false"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: write

concurrency:
  group: java-linkedin-daily-post
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.force_run == true)
      ||
      (github.event_name == 'schedule' && vars.AUTO_POST_ENABLED != 'false')

    runs-on: ubuntu-latest

    env:
      AUTO_POST_ENABLED: ${{ vars.AUTO_POST_ENABLED || 'true' }}
      FORCE_RUN: ${{ inputs.force_run || 'false' }}
      POST_MAX_CHARS: ${{ vars.POST_MAX_CHARS || '2850' }}
      LINKEDIN_VERSION: ${{ vars.LINKEDIN_VERSION || '202609' }}
      LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
      LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
      LINKEDIN_GUIDE_LINK_CARD: ${{ vars.LINKEDIN_GUIDE_LINK_CARD || 'true' }}

    steps:

      # ---------------------------------------------------------
      # 1. Checkout repository
      # ---------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Show schedule / runner information
      # ---------------------------------------------------------
      - name: Show schedule configuration
        run: |
          echo "========================================"
          echo "DAILY LINKEDIN POST CONFIGURATION"
          echo "========================================"
          echo "Target timezone : Asia/Kolkata"
          echo "Target time     : 06:05 AM IST"
          echo "Current UTC     : $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "Runner time     : $(date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "========================================"

      # ---------------------------------------------------------
      # 3. Python
      # ---------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ---------------------------------------------------------
      # 4. Run complete generator test suite
      # ---------------------------------------------------------
      - name: Run generator test suite
        run: |
          python tests/test_content_generator.py

      # ---------------------------------------------------------
      # 5. Generate today's post
      # ---------------------------------------------------------
      - name: Generate post
        run: |
          python src/generate_post.py

      # ---------------------------------------------------------
      # 6. Show generated post
      # ---------------------------------------------------------
      - name: Show generated post
        run: |
          echo "========================================"
          echo "GENERATED LINKEDIN POST"
          echo "========================================"

          cat output/latest.txt

          echo ""
          echo "========================================"
          echo "POST CHARACTER COUNT"
          echo "========================================"

          wc -m output/latest.txt

      # ---------------------------------------------------------
      # 7. Validate generated post
      # ---------------------------------------------------------
      - name: Validate generated output
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import os
          import re

          post = Path("output/latest.txt").read_text(
              encoding="utf-8"
          )

          metadata = json.loads(
              Path("output/metadata.json").read_text(
                  encoding="utf-8"
              )
          )

          max_chars = int(
              os.environ.get(
                  "POST_MAX_CHARS",
                  "2850"
              )
          )

          print("========================================")
          print("POST VALIDATION")
          print("========================================")

          print(f"Characters      : {len(post)}")
          print(f"UTF-8 bytes     : {len(post.encode('utf-8'))}")
          print(f"Topic           : {metadata.get('topic')}")
          print(f"Questions       : {metadata.get('question_count')}")
          print(f"Question bank   : {metadata.get('question_bank_size')}")
          print(f"Fingerprint     : {metadata.get('fingerprint')}")

          # Character limit
          if len(post) > max_chars:
              raise SystemExit(
                  f"Post is {len(post)} characters. "
                  f"Maximum allowed is {max_chars}."
              )

          # Question count
          content_format = metadata.get("content_format")
          allowed_formats = {
              "roadmap", "concept", "production", "architecture",
              "mistakes", "senior", "checklist", "comparison",
              "question_set",
          }

          if content_format not in allowed_formats:
              raise SystemExit(f"Unknown content format: {content_format}")

          # Only question-set posts are required to contain selected questions.
          if content_format == "question_set":
              if metadata.get("question_count") != 5:
                  raise SystemExit("Question-set post must contain exactly 5 primary questions.")
              for question in metadata.get("questions", []):
                  if question not in post:
                      raise SystemExit("Selected question missing or modified:\n" + question)

          # URL
          if not re.search(
              r"https?://\S+",
              post,
              re.IGNORECASE
          ):
              raise SystemExit(
                  "Guide URL is missing."
              )

          # Exactly five hashtags
          hashtags = re.findall(
              r"(?<!\w)#\w+",
              post
          )

          if len(hashtags) != 5:
              raise SystemExit(
                  f"Expected exactly 5 hashtags. "
                  f"Found {len(hashtags)}."
              )

          print("")
          print("VALIDATION PASSED")
          print("========================================")
          PY

      # ---------------------------------------------------------
      # 8. Check LinkedIn configuration
      # ---------------------------------------------------------
      - name: Check LinkedIn configuration
        run: |
          python - <<'PY'
          import os

          token = os.environ.get(
              "LINKEDIN_ACCESS_TOKEN",
              ""
          ).strip()

          person_urn = os.environ.get(
              "LINKEDIN_PERSON_URN",
              ""
          ).strip()

          enabled = os.environ.get(
              "AUTO_POST_ENABLED",
              "false"
          )

          force_run = os.environ.get(
              "FORCE_RUN",
              "false"
          )

          version = os.environ.get(
              "LINKEDIN_VERSION",
              "202609"
          )

          print("========================================")
          print("LINKEDIN CONFIGURATION")
          print("========================================")

          print(
              f"AUTO_POST_ENABLED          : {enabled}"
          )

          print(
              f"FORCE_RUN                  : {force_run}"
          )

          print(
              f"LINKEDIN_VERSION           : {version}"
          )

          print(
              "LINKEDIN_ACCESS_TOKEN      : "
              + ("CONFIGURED" if token else "MISSING")
          )

          print(
              "LINKEDIN_PERSON_URN        : "
              + ("CONFIGURED" if person_urn else "AUTO-DETECT")
          )

          if not token:
              raise SystemExit(
                  "LINKEDIN_ACCESS_TOKEN GitHub Secret is missing."
              )

          if (
              enabled.lower() != "true"
              and force_run.lower() != "true"
          ):
              raise SystemExit(
                  "Publishing disabled. "
                  "Set AUTO_POST_ENABLED=true "
                  "or use force_run=true."
              )

          print("LinkedIn configuration PASSED.")
          PY

      # ---------------------------------------------------------
      # 9. Publish
      # ---------------------------------------------------------
      - name: Publish to LinkedIn
        run: |
          python src/post_to_linkedin.py

      # ---------------------------------------------------------
      # 10. Commit generated output
      # ---------------------------------------------------------
      - name: Commit generated post and metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/

          if git diff --cached --quiet; then
            echo "No output changes to commit."
          else
            git commit -m "chore: generate and publish daily LinkedIn post"
            git push
          fi