name: Daily Java LinkedIn Post

on:
  schedule:
    - cron: "10 8 * * *"
      timezone: "Asia/Kolkata"

  workflow_dispatch:
    inputs:
      force_run:
        description: "Generate and publish once even when AUTO_POST_ENABLED is false"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: write

concurrency:
  group: java-linkedin-daily-post
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.force_run == true)
      ||
      (github.event_name == 'schedule' && vars.AUTO_POST_ENABLED == 'true')

    runs-on: ubuntu-latest

    env:
      AUTO_POST_ENABLED: ${{ vars.AUTO_POST_ENABLED || 'false' }}
      FORCE_RUN: ${{ inputs.force_run || 'false' }}
      POST_MAX_CHARS: ${{ vars.POST_MAX_CHARS || '2850' }}
      LINKEDIN_VERSION: ${{ vars.LINKEDIN_VERSION || '202609' }}
      LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
      LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run generator test suite
        run: python tests/test_content_generator.py

      - name: Generate post
        run: python src/generate_post.py

      - name: Validate generated output
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re
          import os

          post = Path("output/latest.txt").read_text(encoding="utf-8")
          meta = json.loads(Path("output/metadata.json").read_text(encoding="utf-8"))

          max_chars = int(os.environ.get("POST_MAX_CHARS", "2850"))

          print(f"Characters: {len(post)}")
          print(f"Topic: {meta.get('topic')}")
          print(f"Questions: {meta.get('question_count')}")
          print(f"Question bank: {meta.get('question_bank_size')}")

          if len(post) > max_chars:
              raise SystemExit("Generated post exceeds configured character limit.")

          if meta.get("question_count") not in (4, 5):
              raise SystemExit("Expected 4 or 5 complete primary questions.")

          for question in meta.get("questions", []):
              if question not in post:
                  raise SystemExit(f"Selected question missing/altered: {question}")

          followup = meta.get("followup", "")
          if not followup or followup not in post:
              raise SystemExit("Follow-up question missing/altered.")

          if not re.search(r"https?://\S+", post):
              raise SystemExit("Guide URL missing.")

          if len(re.findall(r"(?<!\w)#\w+", post)) != 5:
              raise SystemExit("Expected exactly 5 hashtags.")

          print("Generated output validation PASSED.")
          PY

      - name: Check LinkedIn configuration
        run: |
          python - <<'PY'
          import os

          token = os.environ.get("LINKEDIN_ACCESS_TOKEN", "").strip()
          enabled = os.environ.get("AUTO_POST_ENABLED", "false")
          force_run = os.environ.get("FORCE_RUN", "false")

          print(f"AUTO_POST_ENABLED: {enabled}")
          print(f"FORCE_RUN: {force_run}")
          print(f"LINKEDIN_ACCESS_TOKEN configured: {'YES' if token else 'NO'}")

          if not token:
              raise SystemExit("LINKEDIN_ACCESS_TOKEN is missing.")

          if enabled.lower() != "true" and force_run.lower() != "true":
              raise SystemExit("Publishing is disabled.")
          PY

      - name: Publish to LinkedIn
        run: python src/post_to_linkedin.py

      - name: Commit generated post and metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/

          if git diff --cached --quiet; then
            echo "No output changes to commit."
          else
            git commit -m "chore: generate and publish daily LinkedIn post"
            git push
          fi
