name: Daily Java LinkedIn Post

on:
  # Every day at 06:00 AM Asia/Kolkata (IST)
  schedule:
    - cron: "0 6 * * *"
      timezone: "Asia/Kolkata"

  # Manual testing
  workflow_dispatch:
    inputs:
      force_run:
        description: "Generate and publish once even when AUTO_POST_ENABLED is false"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: write

concurrency:
  group: java-linkedin-daily-post
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.force_run == true)
      ||
      (github.event_name == 'schedule' && vars.AUTO_POST_ENABLED == 'true')

    runs-on: ubuntu-latest

    env:
      AUTO_POST_ENABLED: ${{ vars.AUTO_POST_ENABLED || 'false' }}
      FORCE_RUN: ${{ inputs.force_run || 'false' }}
      POST_MAX_CHARS: ${{ vars.POST_MAX_CHARS || '2850' }}
      LINKEDIN_VERSION: ${{ vars.LINKEDIN_VERSION || '202609' }}
      LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
      LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
      LINKEDIN_GUIDE_LINK_CARD: ${{ vars.LINKEDIN_GUIDE_LINK_CARD || 'false' }}

    steps:

      # ---------------------------------------------------------
      # 1. Checkout
      # ---------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Python
      # ---------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ---------------------------------------------------------
      # 3. Generator tests
      # ---------------------------------------------------------

      - name: Run generator test suite
        run: |
          python tests/test_content_generator.py

      # ---------------------------------------------------------
      # 4. Generate post
      # ---------------------------------------------------------

      - name: Generate post
        run: |
          python src/generate_post.py

      # ---------------------------------------------------------
      # 5. Validate generated output
      # ---------------------------------------------------------

      - name: Validate generated output
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re
          import os

          ROOT = Path(".")

          post_file = ROOT / "output" / "latest.txt"
          metadata_file = ROOT / "output" / "metadata.json"
          guide_file = ROOT / "config" / "book_links.txt"

          if not post_file.exists():
              raise SystemExit(
                  "output/latest.txt does not exist."
              )

          if not metadata_file.exists():
              raise SystemExit(
                  "output/metadata.json does not exist."
              )

          if not guide_file.exists():
              raise SystemExit(
                  "config/book_links.txt does not exist."
              )

          post = post_file.read_text(
              encoding="utf-8"
          ).strip()

          metadata = json.loads(
              metadata_file.read_text(
                  encoding="utf-8"
              )
          )

          max_chars = int(
              os.environ.get(
                  "POST_MAX_CHARS",
                  "2850",
              )
          )

          # -----------------------------------------------------
          # Load guide links ONLY from config/book_links.txt
          # -----------------------------------------------------

          guide_links = [
              line.strip()
              for line in guide_file.read_text(
                  encoding="utf-8"
              ).splitlines()
              if line.strip()
              and not line.strip().startswith("#")
          ]

          if not guide_links:
              raise SystemExit(
                  "No guide links found in config/book_links.txt."
              )

          if len(guide_links) != len(
              set(guide_links)
          ):
              raise SystemExit(
                  "Duplicate guide links found in config/book_links.txt."
              )

          for link in guide_links:
              if not re.fullmatch(
                  r"https://\S+",
                  link,
              ):
                  raise SystemExit(
                      f"Invalid guide URL in config/book_links.txt: {link}"
                  )

          print(
              f"Configured guide links: {len(guide_links)}"
          )

          # -----------------------------------------------------
          # Basic validation
          # -----------------------------------------------------

          print(
              f"Characters: {len(post)}"
          )

          print(
              f"Topic: {metadata.get('topic')}"
          )

          print(
              f"Format: {metadata.get('content_format')}"
          )

          print(
              f"Guide link: {metadata.get('guide_link')}"
          )

          if len(post) > max_chars:
              raise SystemExit(
                  f"Generated post exceeds configured "
                  f"character limit: {len(post)} > {max_chars}"
              )

          if not post:
              raise SystemExit(
                  "Generated post is empty."
              )

          # -----------------------------------------------------
          # Content format
          # -----------------------------------------------------

          allowed_formats = {
              "story",
              "opinion",
              "production",
              "concept",
              "architecture",
              "comparison",
              "mistakes",
              "senior",
              "roadmap",
              "checklist",
              "myth_vs_reality",
              "interview_story",
              "question_set",
          }

          content_format = metadata.get(
              "content_format"
          )

          if content_format not in allowed_formats:
              raise SystemExit(
                  f"Unknown content format: {content_format}"
              )

          # -----------------------------------------------------
          # Question-set validation
          # -----------------------------------------------------

          if content_format == "question_set":

              if metadata.get(
                  "question_count"
              ) != 5:
                  raise SystemExit(
                      "Question-set post must contain "
                      "exactly 5 primary questions."
                  )

              for question in metadata.get(
                  "questions",
                  [],
              ):

                  if question not in post:
                      raise SystemExit(
                          "Selected question missing "
                          "or modified:\n"
                          + question
                      )

          # -----------------------------------------------------
          # Guide CTA validation
          # -----------------------------------------------------

          if "📘" not in post:
              raise SystemExit(
                  "Guide CTA marker is missing."
              )

          metadata_guide_link = str(
              metadata.get(
                  "guide_link",
                  "",
              )
          ).strip()

          if not metadata_guide_link:
              raise SystemExit(
                  "metadata.json does not contain guide_link."
              )

          if metadata_guide_link not in guide_links:
              raise SystemExit(
                  "metadata guide_link is not present "
                  "in config/book_links.txt."
              )

          links_in_post = [
              link
              for link in guide_links
              if link in post
          ]

          if len(links_in_post) != 1:
              raise SystemExit(
                  "Generated post must contain exactly "
                  "one configured guide link. "
                  f"Found {len(links_in_post)}."
              )

          if links_in_post[0] != metadata_guide_link:
              raise SystemExit(
                  "Guide link mismatch between "
                  "post and metadata."
              )

          print(
              "Guide CTA validation PASSED."
          )

          print(
              f"Selected guide link: {metadata_guide_link}"
          )

          # -----------------------------------------------------
          # Hashtags
          # -----------------------------------------------------

          hashtags = re.findall(
              r"(?<!\w)#\w+",
              post,
          )

          if len(hashtags) != 5:
              raise SystemExit(
                  f"Expected exactly 5 hashtags. "
                  f"Found {len(hashtags)}."
              )

          print(
              "Hashtag validation PASSED."
          )

          print("")
          print(
              "Generated output validation PASSED."
          )
          print(
              "========================================"
          )
          PY

      # ---------------------------------------------------------
      # 6. LinkedIn configuration
      # ---------------------------------------------------------

      - name: Check LinkedIn configuration
        run: |
          python - <<'PY'
          import os

          token = os.environ.get(
              "LINKEDIN_ACCESS_TOKEN",
              ""
          ).strip()

          person_urn = os.environ.get(
              "LINKEDIN_PERSON_URN",
              ""
          ).strip()

          enabled = os.environ.get(
              "AUTO_POST_ENABLED",
              "false"
          )

          force_run = os.environ.get(
              "FORCE_RUN",
              "false"
          )

          version = os.environ.get(
              "LINKEDIN_VERSION",
              "202609"
          )

          print("========================================")
          print("LINKEDIN CONFIGURATION")
          print("========================================")

          print(
              f"AUTO_POST_ENABLED     : {enabled}"
          )

          print(
              f"FORCE_RUN             : {force_run}"
          )

          print(
              f"LINKEDIN_VERSION      : {version}"
          )

          print(
              "LINKEDIN_ACCESS_TOKEN : "
              + (
                  "CONFIGURED"
                  if token
                  else "MISSING"
              )
          )

          print(
              "LINKEDIN_PERSON_URN   : "
              + (
                  "CONFIGURED"
                  if person_urn
                  else "AUTO-DETECT"
              )
          )

          if not token:
              raise SystemExit(
                  "LINKEDIN_ACCESS_TOKEN "
                  "GitHub Secret is missing."
              )

          if (
              enabled.lower() != "true"
              and force_run.lower() != "true"
          ):
              raise SystemExit(
                  "Publishing disabled. "
                  "Set AUTO_POST_ENABLED=true "
                  "or use force_run=true."
              )

          print(
              "LinkedIn configuration PASSED."
          )
          PY

      # ---------------------------------------------------------
      # 7. Publish
      # ---------------------------------------------------------

      - name: Publish to LinkedIn
        run: |
          python src/post_to_linkedin.py

      # ---------------------------------------------------------
      # 8. Commit metadata/history changes
      # ---------------------------------------------------------

      - name: Commit generated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f output/

          if git diff --cached --quiet; then
            echo "No output changes to commit."
          else
            git commit -m "chore: publish daily LinkedIn post"
            git push
          fi